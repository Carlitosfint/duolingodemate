name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Los tres controles que corre cualquiera en su máquina antes de subir.
      - name: Tipos
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
